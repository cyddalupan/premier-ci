<div class="card mb-3 animated fadeIn faster lawgpt-library" style="max-width: 100%;">
  <div class="card-header bg-info text-white d-flex align-items-center animated bounceInDown py-2 px-2"
    style="font-size: 1rem">
    <i class="fas fa-lightbulb me-2"></i>
    <span>Prompt & LawGPT Guide Library</span>
  </div>
  <div class="card-body py-2 px-2" style="max-height: 65vh; overflow-y: auto;">
    <div class="lawgpt-accordion">
      <div class="lawgpt-accordion-item" *ngFor="let prompt of combinedPrompts; index as i">
        <div class="lawgpt-accordion-header d-flex align-items-center" [ngClass]="{ 'active': openLawGptIndex === i }"
          (click)="toggleLawGptAccordion(i)">
          <i [class]="prompt.icon + ' fa-fw text-primary me-2'"></i>
          <span class="lawgpt-title fw-bold">{{ prompt.title }}</span>
          <i class="fas" [class.fa-chevron-down]="openLawGptIndex !== i" [class.fa-chevron-up]="openLawGptIndex === i"
            style="margin-left:auto;"></i>
        </div>
        <div class="lawgpt-accordion-body" *ngIf="openLawGptIndex === i">
          <div class="mb-1"><strong>Description:</strong> {{prompt.prompt}}</div>
          <div *ngIf="prompt.example" class="mb-1"><strong>Example:</strong> <span
              class="text-primary">{{prompt.example}}</span></div>
          <div *ngIf="prompt.purpose"><strong>Purpose:</strong> <span class="text-muted">{{prompt.purpose}}</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="chat-card animate__animated animate__fadeIn">
    <!-- Chat Output -->
    <div #chatScroll class="chat-messages">
        <div *ngFor="let msg of messages" class="chat-message-row animate__animated animate__fadeInUp"
            [ngClass]="msg.from">
            <div class="chat-bubble" [ngClass]="msg.from">
                <div class="chat-meta">
                    <span class="chat-badge" [ngClass]="msg.from">
                        <i *ngIf="msg.from==='user'" class="fas fa-user-circle me-1"></i>
                        <i *ngIf="msg.from==='bot'" class="fas fa-robot me-1"></i>
                        {{ msg.from === 'user' ? 'You' : 'LawGPT' }}
                    </span>
                </div>
                <div class="chat-text" [ngClass]="msg.from">
                    <span *ngIf="msg.from==='bot'" [innerHTML]="msg.text"></span>
                    <span *ngIf="msg.from==='user'">{{ msg.text }}</span>
                </div>
            </div>
        </div>
        <div *ngIf="isLoading" class="chat-message-row bot thinking animate__animated animate__fadeIn">
            <div class="chat-bubble bot">
                <div class="chat-text bot">
                    <i class="fas fa-spinner fa-spin me-2"></i>I'm thinking... This might take a while (elapsed: {{
                    thinkingTimer }}s)
                </div>
            </div>
        </div>
    </div>

    <form (ngSubmit)="onSend()" class="chat-input-row" [class.disabled]="isLoading || isProcessingFile">
        <div class="input-group">
            <textarea #inputRef class="form-control" rows="1" [(ngModel)]="userInput" name="userInput"
                [disabled]="isLoading || isProcessingFile" (keydown.enter)="onEnter($event)"
                placeholder="Type your message..."></textarea>
            <input #fileUploadInput *ngIf="isPremium" type="file" accept=".txt,.pdf,.docx,.jpg,.jpeg,.png"
                (change)="onDocSelected($event)" style="display: none;">
            <button *ngIf="isPremium" type="button" class="btn btn-secondary" (click)="onUploadDoc()"
                [disabled]="isLoading || isProcessingFile">
                <i class="fas fa-file-upload"></i>
            </button>
            <button type="submit" class="btn btn-primary animate__animated animate__pulse"
                [disabled]="isLoading || isProcessingFile || dailyLimitReached" style="animation-duration: 2s">
                <i *ngIf="!isLoading" class="fas fa-paper-plane"></i>
                <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
            </button>
        </div>
    </form>
</div>
